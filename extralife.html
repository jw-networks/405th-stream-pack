<!DOCTYPE html>
<!-- EXTRA LIFE goal screen: raised vs goal + recent donors. 1920 x 1080.
     Live from Extra Life (DonorDrive) when config.js → extraLife.teamId or participantId is set (refreshes every 30 s);
     otherwise shows extraLife.raised / goal.   Test:  extralife.html?raised=5384&goal=10000 -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { width: 1920px; height: 1080px; position: relative; }
  .logo { position: absolute; left: 40px; top: 26px; width: 200px; }
  header { position: absolute; left: 0; right: 0; top: 56px; text-align: center; }
  h1 { font-size: 88px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
  header .label { font-size: 30px; display: inline-flex; gap: 16px; align-items: center; margin-top: 6px; }
  .goal { position: absolute; left: 160px; right: 160px; top: 270px; }
  .nums { display: flex; align-items: baseline; gap: 22px; }
  .raised { font-size: 150px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .of { font-size: 60px; font-weight: 800; color: var(--cyan); }
  .pct { margin-left: auto; font-size: 70px; font-weight: 800; color: var(--cyan); font-variant-numeric: tabular-nums; }
  .bar { position: relative; margin-top: 20px; height: 56px; background: var(--teal-dark); box-shadow: inset 0 0 0 2px rgba(92,203,233,.25); overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #3fb7d8, var(--cyan)); transition: width 2s var(--ease); }
  .bar i::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.14) 0 16px, transparent 16px 32px);
                  animation: slide 1.2s linear infinite; }
  @keyframes slide { to { background-position: 45px 0; } }
  .ticks { display: flex; justify-content: space-between; margin-top: 8px; font-size: 22px; color: var(--muted); font-weight: 700; }
  .don { position: absolute; left: 160px; right: 160px; top: 610px; }
  .don h2 { display: flex; align-items: center; gap: 14px; font-size: 30px; margin-bottom: 14px; }
  .list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .d { background: var(--panel); border-top: 3px solid var(--cyan); padding: 14px 18px; min-height: 120px; animation: rise .7s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
  .d .a { font-size: 46px; font-weight: 800; color: #fff; line-height: 1; }
  .d .n { font-size: 30px; font-weight: 800; color: var(--cyan); text-transform: uppercase; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d .m { font-size: 22px; color: #cfd6d8; margin-top: 4px; font-stretch: 90%; font-variation-settings: "wdth" 90; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .src { position: absolute; right: 30px; bottom: 20px; font-size: 16px; color: #555; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body class="hexbg">
<img class="logo" src="assets/logo.png" alt="">
<header><h1 id="title">405th for Extra Life</h1><div class="label"><span class="kink"></span><span>Team goal</span><span class="kink" style="transform:scaleX(-1)"></span></div></header>
<div class="goal">
  <div class="nums"><div class="raised" id="raised">$0</div><div class="of" id="of">of $0</div><div class="pct" id="pct">0%</div></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="ticks"><span>$0</span><span id="t25"></span><span id="t50"></span><span id="t75"></span><span id="t100"></span></div>
</div>
<div class="don"><h2 class="label"><span>Recent donations · thank you!</span><span class="kink"></span></h2><div class="list" id="list"></div></div>
<div class="src" id="src"></div>
<script src="config.js"></script>
<script src="config.local.js" onerror="void 0"></script>
<script>
const C = window.PACK_CONFIG, X = C.extraLife || {}, P = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const money = v => "$" + Math.round(+v || 0).toLocaleString("en-US");
$("title").textContent = X.title || "405th for Extra Life";
const API = "https://www.extra-life.org/api/";
const kind = X.teamId ? "teams/" + X.teamId : X.participantId ? "participants/" + X.participantId : null;
function show(raised, goal) {
  goal = +goal || 1; const p = Math.min(100, (raised / goal) * 100);
  $("raised").textContent = money(raised); $("of").textContent = "of " + money(goal); $("pct").textContent = Math.floor(p) + "%";
  requestAnimationFrame(() => $("fill").style.width = p + "%");
  [25, 50, 75, 100].forEach(q => $("t" + q).textContent = money(goal * q / 100));
}
function donors(list) {
  $("list").innerHTML = "";
  (list || []).slice(0, 6).forEach((d, i) => {
    const el = document.createElement("div"); el.className = "d"; el.style.animationDelay = (i * .08) + "s";
    el.innerHTML = `<div class="a"></div><div class="n"></div><div class="m"></div>`;
    el.querySelector(".a").textContent = d.amount != null ? money(d.amount) : "";
    el.querySelector(".n").textContent = d.displayName || "Anonymous";
    el.querySelector(".m").textContent = d.message || "";
    $("list").appendChild(el);
  });
}
async function load() {
  if (P.get("raised")) { show(+P.get("raised"), +(P.get("goal") || X.goal)); return; }
  if (!kind) { show(X.raised || 0, X.goal || 0); $("src").textContent = "Amounts from config.js"; return; }
  try {
    const t = await (await fetch(API + kind, { cache: "no-store" })).json();
    show(t.sumDonations || 0, t.fundraisingGoal || X.goal);
    const d = await (await fetch(API + kind + "/donations?limit=6", { cache: "no-store" })).json();
    donors(d);
    $("src").textContent = "Live from Extra Life · updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) { $("src").textContent = "Extra Life didn't answer; retrying"; if (!$("raised").textContent || $("raised").textContent === "$0") show(X.raised || 0, X.goal || 0); }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
