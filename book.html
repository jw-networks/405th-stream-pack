<!DOCTYPE html>
<!-- BOOK CLUB · the book on screen. Transparent 1920 x 1080 (sits over FRAMES · book in "Book Club · Spotlight").
     Filled in from the Director → Book Club panel (stored in OBS as "book405").
     Test:  book.html?state={"title":"Halo: The Fall of Reach","author":"Eric Nylund","session":"Chapters 5–8","progress":40,"note":"Discussion starts 8 PM"} -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { width: 1920px; height: 1080px; position: relative; }
  #wrap { position: absolute; left: 64px; top: 136px; width: 1232px; height: 746px; display: flex; gap: 56px; align-items: center;
          opacity: 0; transform: translateY(24px); transition: opacity .6s, transform .8s var(--ease); }
  #wrap.on { opacity: 1; transform: none; }
  .cover { flex: 0 0 440px; height: 660px; position: relative; box-shadow: 0 24px 60px rgba(0,0,0,.6); background: #111; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--cyan); pointer-events: none; }
  .cover::before { content: ""; position: absolute; left: -10px; top: -10px; width: 60px; height: 60px; border-top: 6px solid var(--cyan); border-left: 6px solid var(--cyan); z-index: 2; }
  /* no cover image: a generated one */
  .gen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 44px 36px;
         background: linear-gradient(160deg, #17706d 0%, #0e4846 55%, #0b2b2a 100%); }
  .gen .gt { font-size: 64px; font-weight: 800; line-height: 1; text-transform: uppercase; font-variation-settings: "wdth" 75; }
  .gen .ga { font-size: 30px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #bfeaf5; }
  .gen img { width: 96px; height: 120px; object-fit: contain; opacity: .85; align-self: flex-end; }
  .info { flex: 1; min-width: 0; }
  .kick { display: inline-flex; align-items: center; gap: 14px; }
  .kick .label { font-size: 30px; }
  h1 { margin: 18px 0 6px; font-size: 104px; line-height: .95; font-weight: 800; text-transform: uppercase; font-variation-settings: "wdth" 75; }
  .by { font-size: 44px; font-weight: 700; color: #d7dde0; letter-spacing: .04em; }
  .by b { color: var(--cyan); font-weight: 800; }
  .sess { margin-top: 40px; display: inline-flex; align-items: stretch; font-size: 34px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .sess span:first-child { background: var(--teal); padding: 10px 18px; }
  .sess span:last-child { background: var(--panel); padding: 10px 22px; border-top: 3px solid var(--cyan); }
  .prog { margin-top: 36px; }
  .prog .row { display: flex; justify-content: space-between; font-size: 26px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .prog .track { height: 18px; background: var(--teal-dark); }
  .prog .fill { height: 100%; width: 0; background: var(--cyan); transition: width 1.2s var(--ease); }
  .note { margin-top: 34px; font-size: 34px; font-weight: 600; color: #cfd6d9; line-height: 1.25; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div class="cover" id="cover"></div>
  <div class="info">
    <div class="kick"><span class="label">Now reading</span><span class="kink"></span></div>
    <h1 id="title"></h1>
    <div class="by" id="by"></div>
    <div class="sess" id="sess"><span>This session</span><span id="sessT"></span></div>
    <div class="prog" id="prog"><div class="row"><span>Club progress</span><span id="pct"></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
    <div class="note" id="note"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="config.local.js" onerror="void 0"></script>
<script src="assets/sha256.js"></script>
<script src="assets/obsstate.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fit(el, max, min) { el.style.fontSize = max + "px"; let s = max; while (s > min && (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2)) { s -= 2; el.style.fontSize = s + "px"; } }
function render(b) {
  b = b || {};
  if (!b.title) { $("wrap").classList.remove("on"); return; }
  $("title").textContent = b.title;
  $("by").innerHTML = b.author ? "by <b>" + esc(b.author) + "</b>" : "";
  $("sessT").textContent = b.session || "";
  $("sess").classList.toggle("hide", !b.session);
  const pct = Math.max(0, Math.min(100, Number(b.progress)));
  $("prog").classList.toggle("hide", !(b.progress !== "" && b.progress != null && !isNaN(pct)));
  $("pct").textContent = pct + "%";
  requestAnimationFrame(() => $("fill").style.width = pct + "%");
  $("note").textContent = b.note || "";
  $("cover").innerHTML = b.cover
    ? `<img src="${esc(b.cover)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'gen',innerHTML:window.genCover}))">`
    : `<div class="gen">${genHtml(b)}</div>`;
  window.genCover = genHtml(b);
  // biggest size that keeps the title to 2 lines
  const t = $("title"); let fs = 104; t.style.fontSize = fs + "px";
  while (fs > 48 && t.scrollHeight > fs * 2.1) t.style.fontSize = (fs -= 4) + "px";
  $("wrap").classList.add("on");
}
function genHtml(b) { return `<div class="gt">${esc(b.title)}</div><div><div class="ga">${esc(b.author || "")}</div></div><img src="assets/emblem.png" alt="">`; }
OBSState.watch("book405", render, { poll: 3000 });
</script>
</body>
</html>
