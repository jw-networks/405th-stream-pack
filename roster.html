<!DOCTYPE html>
<!-- Full-screen lineup board (styled like the schedule cards). Updates live from the names file.
     OBS Browser Source 1920 x 1080.
     URL options: ?title=Tonight's%20Fireteam   &sub=Costumed%20Firefight   &demo -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { width: 1920px; height: 1080px; position: relative; }
  .logo { position: absolute; left: 44px; top: 30px; width: 230px; }
  header { position: absolute; left: 0; right: 0; top: 46px; text-align: center; }
  header h1 { font-size: 92px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
  header .sub { margin-top: 14px; display: inline-flex; align-items: center; gap: 18px; font-size: 30px; }

  main { position: absolute; left: 330px; right: 330px; top: 260px; display: grid; gap: 22px 44px; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .card { display: flex; height: 88px; box-shadow: 0 10px 28px rgba(0,0,0,.45);
          opacity: 0; transform: translateY(18px); transition: opacity .5s ease, transform .6s var(--ease); }
  .card.in { opacity: 1; transform: none; }
  .card .tag { flex: 0 0 170px; background: var(--teal); display: grid; place-items: center;
               font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .card .nm { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 0 22px;
              font-size: 46px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden;
              border-top: 3px solid var(--cyan); }
  .card.host { height: 108px; }
  .card.host .tag { background: var(--cyan); color: #0d2a33; }
  .card.host .nm { font-size: 56px; }
  .card.empty .nm { color: #555; }
  .card.flash .nm { animation: flash .9s ease; }
  @keyframes flash { 0% { background-color: rgba(92,203,233,.35); } 100% { background-color: transparent; } }
  .divider { height: 18px; margin-top: 6px; display: flex; align-items: center; gap: 18px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 2px; background: var(--tc, rgba(92,203,233,.35)); opacity: .6; }
  .divider span { color: var(--tc); }
  .card.ta .tag { background: color-mix(in srgb, var(--ta) 55%, #0d0d0d); } .card.tb .tag { background: color-mix(in srgb, var(--tb) 55%, #0d0d0d); }
  .card.ta .nm { border-top-color: var(--ta); } .card.tb .nm { border-top-color: var(--tb); }
  .divider span { font-size: 24px; }

  footer { text-transform: uppercase; position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 34px; font-weight: 800; letter-spacing: .12em; }
</style>
</head>
<body class="hexbg">
<img class="logo" src="assets/logo.png" alt="">
<header>
  <h1 id="title">Tonight's Fireteam</h1>
  <div class="sub"><span class="kink"></span><span class="label" id="sub"></span><span class="kink" style="transform:scaleX(-1)"></span></div>
</header>
<main id="grid"></main>
<footer id="url"></footer>

<script src="config.js"></script>
<script src="config.local.js" onerror="void 0"></script>
<script src="assets/names.js"></script>
<script>
  const P = new URLSearchParams(location.search);
  const C = Names.config;
  if (P.get("title")) document.getElementById("title").textContent = P.get("title");
  document.getElementById("sub").textContent = P.get("sub") || C.eventTitle || "";
  document.getElementById("url").textContent = C.website || "";

  const grid = document.getElementById("grid");
  const cards = {};
  const short = s => s.startsWith("host") ? "Host" : "P" + s.slice(1);
  function card(seat) {
    const el = document.createElement("div");
    el.className = "card hexpanel" + (seat.startsWith("host") ? " host" : "");
    el.innerHTML = `<div class="tag">${short(seat)}</div><div class="nm"></div>`;
    grid.appendChild(el);
    cards[seat] = el;
  }
  card("host1"); card("host2");
  const T = (window.PACK_CONFIG.teams) || { a: { name: "Team A", color: "#5ccbe9" }, b: { name: "Team B", color: "#ff6a4d" } };
  document.documentElement.style.setProperty("--ta", T.a.color);
  document.documentElement.style.setProperty("--tb", T.b.color);
  const heads = ["a", "b"].map(t => { const d = document.createElement("div"); d.className = "divider"; d.style.setProperty("--tc", T[t].color);
    d.innerHTML = '<span class="label"></span>'; grid.appendChild(d); return [t, d]; });
  // two columns: P1-P4 left, P5-P8 right
  [1,5,2,6,3,7,4,8].forEach(n => { card("p" + n); cards["p" + n].classList.add(n <= 4 ? "ta" : "tb"); });

  let first = true;
  Names.onChange(() => {
    heads.forEach(([t, d]) => d.querySelector("span").textContent = Names.get("team" + t) || T[t].name);
    Object.entries(cards).forEach(([seat, el], i) => {
      const name = Names.get(seat);
      const nm = el.querySelector(".nm");
      const txt = name || "Open seat";
      if (!first && nm.textContent !== txt) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
      nm.textContent = txt;
      el.classList.toggle("empty", !name);
      fitText(nm, seat.startsWith("host") ? 56 : 46, 24);
      if (first) setTimeout(() => el.classList.add("in"), 120 + i * 70);
    });
    first = false;
  });
  Names.start();
</script>
</body>
</html>
