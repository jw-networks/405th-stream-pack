<!DOCTYPE html>
<!-- CAM source for one seat (native OBS setup). Used through presets/cam-<seat>.html.
     Shows the seat's camera link from config.local.js, or a "Standby" card when there is none.
     Change a link: edit config.local.js, then right-click the CAM source in OBS → Refresh. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/theme.css">
<style>
  html, body { width: 100vw; height: 100vh; background: #000; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .slate { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2vh; }
  .slate img { width: 18vw; opacity: .55; }
  .slate b { font-size: 7vh; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #cfe9f1; }
  .slate span { font-size: 3.4vh; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<script src="config.js"></script>
<script src="config.local.js" onerror="void 0"></script>
<script src="assets/layouts.js"></script>
<script src="assets/cameras.js"></script>
<script>
  const seat = (new URLSearchParams(location.search).get("seat") || "p1").toLowerCase();
  const url = cameraUrl(seat, "overlay");
  if (url) {
    const f = document.createElement("iframe");
    f.src = url;
    f.allow = "autoplay; fullscreen; camera; microphone; display-capture";
    document.body.appendChild(f);
  } else {
    document.body.className = "hexbg";
    document.body.innerHTML = `<div class="slate"><img src="assets/emblem.png" alt=""><b>${LAYOUTS.seatName(seat)}</b><span>Standby</span></div>`;
  }
</script>
</body>
</html>
